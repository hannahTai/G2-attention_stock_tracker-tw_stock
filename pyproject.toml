[project]
name = "attention-stock-tracker"
version = "0.1.0"
description = "台股注意股：還差幾步會被處置"
readme = "README.md"
authors = [
    { name = "hannahTai", email = "hannahtai.work@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "tzdata",   # Windows 沒有內建時區資料庫，zoneinfo 要靠這個套件
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "crawler", "transform", "analyze"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
