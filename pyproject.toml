[project]
name = "attention-stock-tracker"
version = "0.1.0"
description = "台股注意股：還差幾步會被處置"
readme = "README.md"
authors = [
    { name = "hannahTai", email = "hannahtai.work@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",   # PostgreSQL 驅動
    "python-dotenv>=1.0",
    "tzdata",   # Windows 沒有內建時區資料庫，zoneinfo 要靠這個套件
    "fastapi>=0.165.0",           # 資料 API（api/）
    "uvicorn[standard]>=0.54.0",  # 跑 FastAPI 的伺服器
    "streamlit>=1.67.0",          # 網頁（dashboard/），打資料 API
    "jinja2>=3.1.6",              # 網頁範本（dashboard/templates/），Streamlit 用 st.html 顯示
    "celery>=5.5",                # 任務佇列（USE_CELERY=1 時，producer 把任務送進 RabbitMQ 給 worker 做）
    "anthropic>=1.0",             # Claude API（ai/：公告分類、新聞摘要、卡片 AI 摘要）
    "trafilatura>=2.0",           # 新聞網頁：抽 meta 摘要、正文（正文只在記憶體裡用，不存）
    "sentence-transformers>=5.0", # 新聞 RAG：本機跑 bge-m3 把新聞（標題＋新聞摘要）轉成向量（embedding）
    "torch>=2.6",                 # sentence-transformers 要用；從下面的 pytorch-cpu 裝 CPU 版（比預設的 CUDA 版小約 2 GB）
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "crawler", "transform", "analyze", "ai", "api", "dashboard"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8",
    "ruff>=0.17.6",
]

# torch 只裝 CPU 版：容器、筆電都沒有 GPU
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests", "common", "crawler", "transform", "analyze", "ai", "api", "dashboard"]
addopts = "--doctest-modules"
filterwarnings = ["ignore:SOCKS support in urllib3"]   # trafilatura 載入 urllib3 的 SOCKS 支援（沒用到）
markers = ["integration: 連本機 PostgreSQL 的整合測試（建測試用資料庫 <資料庫>_test，測完刪掉）"]

# ruff：檢查程式（uv run ruff check .）。行長照專案現在的寫法放寬到 140（中文註解比較長）
[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle：格式
    "F",        # pyflakes：沒用到的 import、變數，打錯的名字
    "B",        # bugbear：常見的 bug 寫法（例如可變的預設參數）
    "UP",       # pyupgrade：用 Python 3.12 的寫法
    "SIM",      # 可以寫得更簡單的地方
]

[tool.ruff.lint.per-file-ignores]
# prompt 的文字：換行會改到送給 LLM 的內容（要換 PROMPT_VERSION、重跑），行長不檢查
"ai/classifier.py" = ["E501"]
"ai/summarizer.py" = ["E501"]
"ai/card_summarizer.py" = ["E501"]
