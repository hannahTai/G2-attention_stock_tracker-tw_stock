# 注意股，還差幾步？一鍵啟動：PostgreSQL、RabbitMQ、Celery worker、Flower、資料 API、網頁
#
# Docker 裝在 WSL 裡：在 Windows 的 PowerShell 要在前面加 wsl（在 WSL 的終端機裡直接打 docker compose）
#   wsl docker compose up -d --build        # 啟動（第一次或改了套件加 --build）
#   本機開發時 .env 的 COMPOSE_FILE 會把 docker-compose.local.yml 疊上來：程式碼直接掛進容器，api、web 存檔就自動重載（見那個檔）
#   wsl docker compose ps                   # 看狀態
#   wsl docker compose logs -f celery-transform   # 看 log（服務名稱見下面；log 檔另外存在 data/logs/）
#   wsl docker compose down                 # 停掉（資料留在 volume pgdata）
#   wsl docker compose run --rm producer python main.py                       # 跑一次股價線（證交所 → 整理 → 還差幾次）
#   wsl docker compose run --rm producer python main.py news                  # 跑一次新聞線（觀測站、新聞 → 整理 → AI）
#   wsl docker compose run --rm producer python main.py backfill --start 20261101   # 回補（兩條線）
#
# 網址（本機）：
#   網頁      http://localhost:8502
#   資料 API  http://localhost:8001/docs
#   Flower    http://localhost:5556     看 worker、任務的執行狀況
#   RabbitMQ  http://localhost:15673    管理介面（帳密 .env 的 RABBITMQ_USER／RABBITMQ_PASSWORD）
#   資料庫    localhost:5432
# RabbitMQ、Flower 的埠號故意不用預設的 5672、15672、5555：課程的容器已經佔用了。
# 只有網頁（8502）開給別台電腦（同一個網路的手機、筆電）；資料庫、RabbitMQ、Flower、資料 API 只開在這台電腦（127.0.0.1），
# 別台電腦連不到（Windows 上的 main.py、排程、pytest 照樣用 127.0.0.1 連得到）。
#
# 連線設定（密碼等）從 .env 讀；容器之間用服務名稱連（db、rabbitmq、api），所以 x-app 會蓋掉 .env 的主機和埠號。
# 資料庫、RabbitMQ、Flower 的帳號密碼一定要在 .env 設（DB_USER、DB_PASSWORD、RABBITMQ_USER、RABBITMQ_PASSWORD、FLOWER_USER、FLOWER_PASSWORD），
# 沒設 docker compose 會直接停下來說缺哪個。
# 不要用 docker compose down -v：-v 會連 volume 一起刪，資料庫就沒了。

# 專案的 image（Dockerfile）：setup、api、web、producer、八個 Celery worker 都用同一個，只是指令不同
x-image: &image
  build: .
  image: attention-stock-tracker
  logging:                              # 畫面上的 log（docker compose logs）：每個容器最多 3 個 10MB 的檔，舊的自動丟掉
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

# 要連資料庫、RabbitMQ、Claude API 的服務（web 以外的）：整個 .env 都給
x-app: &app
  <<: *image
  env_file: .env
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: "5672"
    USE_CELERY: "1"                     # 容器裡的 producer 把任務送進 RabbitMQ，給 worker 做
    API_URL: http://api:8001
    LOG_DIR: /app/logs
    HF_HOME: /app/data/hf               # 新聞 RAG 的 embedding 模型（bge-m3，約 2.3 GB）下載到這裡，重建 image 不用再下載

# Celery worker 共同的：RabbitMQ 和資料表都準備好才啟動
x-celery: &celery
  <<: *app
  depends_on:
    rabbitmq:
      condition: service_healthy
    setup:
      condition: service_completed_successfully
  restart: unless-stopped
  volumes:
    - ./data/logs:/app/logs             # worker 的 log 另外寫在本機的 data/logs/（每天一個檔，留 30 天；見 common/logs.py）

services:
  # ---------- 儲存、佇列 ----------
  # PostgreSQL 17（含 pgvector，之後要用向量直接 CREATE EXTENSION vector）
  db:
    image: pgvector/pgvector:pg17
    container_name: postgres            # scripts/backup_db.py 用這個名字跑 pg_dump（PG_CONTAINER）
    restart: unless-stopped
    environment:
      # 帳號密碼從 .env 讀（一定要設）；只在第一次建 volume（第一次啟動）時用，之後改 .env 不會改到資料庫裡的密碼
      POSTGRES_USER: ${DB_USER:?.env 要設 DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 要設 DB_PASSWORD}
      TZ: Asia/Taipei
      PGTZ: Asia/Taipei
    ports:
      - "127.0.0.1:5432:5432"           # 本機的程式（main.py、排程、pytest）連得到；別台電腦連不到
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:                        # 資料庫真的能連了，才啟動後面的服務
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # RabbitMQ：任務佇列（producer 送任務進來，worker 拿去做）
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq                  # 固定主機名稱：RabbitMQ 的資料（帳號、佇列）依主機名稱存，不固定的話每次重建容器都會重來
    restart: unless-stopped
    environment:
      # 和資料庫一樣：帳號密碼從 .env 讀（一定要設）；只在第一次建 volume（第一次啟動）時建這個帳號，
      # 之後改 .env 不會改到已經建好的帳號（要改密碼用 rabbitmqctl change_password）
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?.env 要設 RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?.env 要設 RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5673:5672"           # 本機的 producer 要送任務進來時用（.env 設 USE_CELERY=1、RABBITMQ_PORT=5673）
      - "127.0.0.1:15673:15672"         # 管理介面
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # 建資料庫、建表、重建 VIEW（已經存在的表跳過），做完就結束
  setup:
    <<: *app
    command: ["python", "-c", "from common import repository; repository.create_tables(); print('tables ready')"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ---------- Celery worker（佇列的分法見 common/worker.py）----------
  # worker 名稱固定成「佇列@tw_stock」（Flower、任務歷史 job_run 上看到的就是這個）；@ 前面也是 log 檔名（data/logs/crawl_twse-…）
  # 證交所：一次只做一個，每個任務後等 SLEEP_SECONDS 秒（TwseJob），太快會被擋
  celery-crawl-twse:
    <<: *celery
    command: ["celery", "-A", "common.worker", "worker", "-Q", "crawl_twse", "--concurrency", "1",
              "--hostname", "crawl_twse@tw_stock", "--loglevel", "INFO"]

  # 觀測站：一次只做一個，每個任務後等 SLEEP_SECONDS_MOPS 秒（MopsJob）
  celery-crawl-mops:
    <<: *celery
    command: ["celery", "-A", "common.worker", "worker", "-Q", "crawl_mops", "--concurrency", "1",
              "--hostname", "crawl_mops@tw_stock", "--loglevel", "INFO"]

  # 新聞：FinMind 新聞清單，一次只做一個，每個任務後等一下（FinmindJob）；新聞網頁在下面的 celery-crawl-news
  celery-crawl-finmind:
    <<: *celery
    command: ["celery", "-A", "common.worker", "worker", "-Q", "crawl_finmind", "--concurrency", "1",
              "--hostname", "crawl_finmind@tw_stock", "--loglevel", "INFO"]

  # 新聞網頁（crawl_news_detail，只存 <head>）：分散在十幾個網站，同時做 4 個；任務照網站輪流排（crawler/producer.py 的 spread_by_site），
  # 同時打的大多是不同網站；每個任務後照樣等 SLEEP_SECONDS_NEWS_DETAIL 秒
  celery-crawl-news:
    <<: *celery
    command: ["celery", "-A", "common.worker", "worker", "-Q", "crawl_news", "--concurrency", "4",
              "--hostname", "crawl_news@tw_stock", "--loglevel", "INFO"]

  # transform（raw → stage）：只讀寫自己的資料庫，同時做 4 個
  celery-transform:
    <<: *celery
    command: ["celery", "-A", "common.worker", "worker", "-Q", "transform", "--concurrency", "4",
              "--hostname", "transform@tw_stock", "--loglevel", "INFO"]

  # analyze（stage → app）：每天讀往前 30 個營業日，天和天之間互不依賴，同時做 2 個
  celery-analyze:
    <<: *celery
    command: ["celery", "-A", "common.worker", "worker", "-Q", "analyze", "--concurrency", "2",
              "--hostname", "analyze@tw_stock", "--loglevel", "INFO"]

  # AI（ai/）：呼叫 Claude API（公告分類、新聞摘要）、同一件事（不呼叫 API），同時做 2 個（API 有每分鐘的次數限制）；金鑰 ANTHROPIC_API_KEY 從 .env 讀
  celery-ai:
    <<: *celery
    command: ["celery", "-A", "common.worker", "worker", "-Q", "ai", "--concurrency", "2",
              "--hostname", "ai@tw_stock", "--loglevel", "INFO"]

  # 要用本機 embedding 模型的 AI 任務（新聞 RAG 轉向量、卡片 AI 摘要的查詢向量）：只有這個 worker 載入模型（約 2.3 GB 記憶體），
  # 一次做一個（吃 CPU；卡片 AI 摘要也要照日期先後寫，才能沿用前一天的）；模型載入後留在記憶體，下一個任務不用重載
  celery-embed:
    <<: *celery
    command: ["celery", "-A", "common.worker", "worker", "-Q", "embed", "--concurrency", "1",
              "--hostname", "embed@tw_stock", "--loglevel", "INFO"]
    volumes:
      - ./data/logs:/app/logs
      - ./data/hf:/app/data/hf          # embedding 模型的快取（見上面的 HF_HOME）

  # Flower：網頁上看 worker、任務的執行狀況。打開要登入（FLOWER_USER／FLOWER_PASSWORD，和 RabbitMQ 的分開：知道一組不等於知道另一組）
  flower:
    image: mher/flower:2.0.1
    restart: unless-stopped
    command: ["celery", "flower", "--port=5555"]
    environment:
      # 連 RabbitMQ 的網址（含密碼）放環境變數，不寫在指令上（指令會出現在 docker compose ps、程序清單裡）
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:?.env 要設 RABBITMQ_USER}:${RABBITMQ_PASSWORD:?.env 要設 RABBITMQ_PASSWORD}@rabbitmq:5672//
      FLOWER_BASIC_AUTH: ${FLOWER_USER:?.env 要設 FLOWER_USER}:${FLOWER_PASSWORD:?.env 要設 FLOWER_PASSWORD}   # 打開 Flower 要登入
      TZ: Asia/Taipei                   # 和 worker 同一個時區，不然 Flower 會警告時間差 8 小時
    ports:
      - "127.0.0.1:5556:5555"
    depends_on:
      rabbitmq:
        condition: service_healthy

  # producer：決定要做哪些任務、送進佇列（main.py 或 python -m crawler.producer…）。平常不啟動，用 run 執行一次：
  #   wsl docker compose run --rm producer python main.py
  producer:
    <<: *app
    profiles: ["manual"]                # docker compose up 不會啟動它
    command: ["python", "main.py"]
    volumes:
      - ./data:/app/data                # main.py 的檔案鎖（同一條線同一時間只跑一輪）放在本機的 data/
    depends_on:
      celery-crawl-twse:
        condition: service_started
      celery-crawl-mops:
        condition: service_started
      celery-crawl-finmind:
        condition: service_started
      celery-crawl-news:
        condition: service_started
      celery-transform:
        condition: service_started
      celery-analyze:
        condition: service_started
      celery-ai:
        condition: service_started
      celery-embed:
        condition: service_started

  # ---------- 網站 ----------
  # 資料 API（FastAPI）：網頁只打這個，不直接連資料庫
  api:
    <<: *app
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"           # 網頁在容器之間用 http://api:8001 連；這台電腦的瀏覽器、run_web.bat 用 127.0.0.1
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # 網頁（FastAPI＋Jinja2）：打上面的資料 API，回傳整頁 HTML。不給 .env：網頁不連資料庫、不用金鑰，
  # 只要知道資料 API 在哪（網頁有漏洞也拿不到密碼）
  web:
    <<: *image
    environment:
      API_URL: http://api:8001
    command: ["uvicorn", "dashboard.app:app", "--host", "0.0.0.0", "--port", "8502"]
    ports:
      - "8502:8502"                     # 唯一開給別台電腦的埠號
    depends_on:
      - api
    restart: unless-stopped

volumes:
  # 資料庫的檔案。name 固定成 pgdata：已經有這個 volume 就直接用（保留現有資料），沒有就新建
  pgdata:
    name: pgdata
  # RabbitMQ 的資料（帳號、佇列）；搭配上面固定的 hostname，重建容器也留著
  rabbitmq-data:
