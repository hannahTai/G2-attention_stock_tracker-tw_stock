<text x="16" y="662" class="n">虛線框＝同一批一起送進佇列，互不等（crawl_twse 一次做一個，所以框裡是一個接一個做完）　同一欄、不同 worker 的同時進行</text>
<text x="16" y="680" class="n">AI 的五個任務都在 ai 這個 worker，一次一個、照箭頭順序做：只載入一份 bge-m3 模型，卡片 AI 摘要也照日期先後寫</text>
<text x="16" y="698" class="n">兩條線各自排程，只靠 stage_watched_stock 接起來：新聞線讀股價線整理好的注意股，決定查哪些公司；卡片 AI 摘要只寫注意股整理好的日子</text>
