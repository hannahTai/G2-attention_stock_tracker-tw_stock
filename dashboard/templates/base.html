{# 每一頁的外框。Streamlit 用 st.html 顯示，所以這裡沒有 <html>、<head>；
   CSS 由 app.py 另外用 st.markdown 送（render.style_html()）：st.html 會把 <style> 拿掉。
   換頁都用網址參數（?date=、?tab=、?only=、?stock=），點連結會重新載入、Streamlit 讀網址決定畫哪一頁。
   st.html 不會執行 JavaScript，所以交易日選單用 <details> 做成下拉清單；
   右上角放各頁自己的東西（header_right）：總覽是交易日選單和搜尋框，個股頁沒有。 #}
{# lang：讀螢幕軟體用中文唸；跳到主要內容：鍵盤使用者不用每頁都先跳過標題、交易日選單 #}
<div class="wrap" lang="zh-Hant-TW">
  <a class="skip" href="#main">跳到主要內容</a>
  <header class="top">
    <div>
      <h1><a href="?{% if day %}date={{ ymd(day) }}{% endif %}">注意股，還差幾步？</a></h1>
      <p class="sub">上市注意股離處置還差幾次、什麼時候處置和出關{% if day %}・資料截至 <span class="mono">{{ roc(day) }}</span> 收盤{% endif %}</p>
    </div>
    <div class="top-right">
      {% block header_right %}{% endblock %}
    </div>
  </header>

  <main id="main">
  {% if notice %}<p class="banner">{{ notice }}</p>{% endif %}

  {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    <p>計算依據：臺灣證券交易所《公布或通知注意交易資訊暨處置作業要點》第四條及第六條。</p>
    <p>資料來源：臺灣證券交易所（注意股、處置股、開休市日期）、公開資訊觀測站（重大訊息）。</p>
    <p>免責聲明：本網站僅彙整主管機關已公布之資訊，並依前述規定推算處置進度，不預測股價，亦不構成任何投資建議；推算結果以臺灣證券交易所公告為準。</p>
  </footer>
</div>
